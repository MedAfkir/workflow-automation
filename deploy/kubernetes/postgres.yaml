---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: workflow
type: Opaque
stringData:

  POSTGRES_DB: workflow
  POSTGRES_USER: workflow
  POSTGRES_PASSWORD: workflow
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: workflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: workflow-platform
spec:

  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: workflow
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: workflow-platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "workflow", "-d", "workflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "workflow", "-d", "workflow"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]

        resources:
          requests:
            storage: 5Gi
