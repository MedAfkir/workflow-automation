apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-app-api
  namespace: workflow
  labels:
    app.kubernetes.io/name: workflow-platform
    app.kubernetes.io/component: app-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:

      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: workflow-platform
      app.kubernetes.io/component: app-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflow-platform
        app.kubernetes.io/component: app-api
      annotations:

        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app-api
          image: ghcr.io/medafkir/workflow-automation:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: workflow-config
            - secretRef:
                name: workflow-secrets

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http

            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 1000m

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

      terminationGracePeriodSeconds: 60
