apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-config
  namespace: workflow
  labels:
    app.kubernetes.io/name: workflow-platform
    app.kubernetes.io/component: app-api
data:

  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.workflow.svc.cluster.local:5432/workflow

  WORKFLOW_DISPATCHER_POLL_INTERVAL: PT2S
  WORKFLOW_DISPATCHER_LEASE_TTL: PT5M
  WORKFLOW_DISPATCHER_BATCH_SIZE: "10"
  WORKFLOW_DISPATCHER_GC_INTERVAL: PT1M
  WORKFLOW_DISPATCHER_SHUTDOWN_TIMEOUT: PT30S

  WORKFLOW_TRIGGER_ENABLED: "true"
  WORKFLOW_TRIGGER_POLL_INTERVAL: PT5S

  WORKFLOW_LOGS_FLUSH_INTERVAL: "200"
  WORKFLOW_LOGS_FLUSH_BATCH_SIZE: "200"
  WORKFLOW_LOGS_BUFFER_CAPACITY: "2048"

  WORKFLOW_SECRETS_VAULT_ENABLED: "false"

  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
